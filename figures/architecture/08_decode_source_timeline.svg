<svg xmlns="http://www.w3.org/2000/svg" width="2250" height="670" viewBox="0 0 2250 670">
  <title>单个 uBatch 的执行路径</title>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#d97706"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#dc2626"/>
    </marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#64748b" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="2250" height="670" fill="#ffffff"/>
  <text x="1125" y="52" text-anchor="middle" font-family="Arial, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="31" font-weight="700" fill="#111827">单个 uBatch 的执行路径</text>

  <line x1="235" y1="96" x2="2190" y2="96" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="2130" y="84" font-family="Arial, sans-serif" font-size="15" fill="#475569">time</text>

  <g font-family="Arial, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="700" fill="#0f172a">
    <text x="35" y="166">A: GPU compute (L-1)</text>
    <text x="35" y="256">B: update stream (L-1)</text>
    <text x="35" y="346">A: policy / comm (L)</text>
    <text x="35" y="436">CPU worker A (L)</text>
    <text x="35" y="526">Peer GPU B (L-1)</text>
    <text x="35" y="616">A: GPU compute (L)</text>
  </g>

  <g stroke="#cbd5e1" stroke-width="1.2">
    <line x1="235" y1="180" x2="2190" y2="180"/>
    <line x1="235" y1="270" x2="2190" y2="270"/>
    <line x1="235" y1="360" x2="2190" y2="360"/>
    <line x1="235" y1="450" x2="2190" y2="450"/>
    <line x1="235" y1="540" x2="2190" y2="540"/>
    <line x1="235" y1="630" x2="2190" y2="630"/>
  </g>

  <!-- Overlap windows, behind the work boxes. -->
  <rect x="330" y="118" width="370" height="166" rx="12" fill="url(#hatch)" opacity="0.13" stroke="#64748b" stroke-width="1.2" stroke-dasharray="6 5"/>
  <rect x="1410" y="388" width="210" height="166" rx="12" fill="url(#hatch)" opacity="0.13" stroke="#64748b" stroke-width="1.2" stroke-dasharray="6 5"/>

  <!-- Phase 1: B stages U2 weights while A still has useful GPU work. -->
  <rect x="250" y="130" width="460" height="55" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="480" y="153" text-anchor="middle" font-family="Arial, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="700" fill="#1e3a8a">A(L-1) GPU model work</text>
  <text x="480" y="174" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#1e40af">cached MoE + reduce + attention/router(L)</text>

  <rect x="330" y="220" width="370" height="55" rx="9" fill="#fed7aa" stroke="#ea580c" stroke-width="1.5"/>
  <text x="515" y="243" text-anchor="middle" font-family="Arial, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="700" fill="#9a3412">B(L-1): U2 专家权重 H2D → Decode Buffer</text>
  <text x="515" y="264" text-anchor="middle" font-family="Arial, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="12" fill="#9a3412">最多 2 个 Expert：W13 / W2 / 两组 FP8 Scale</text>

  <rect x="720" y="130" width="92" height="55" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="766" y="153" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#1e3a8a">reader</text>
  <text x="766" y="174" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#1e40af">done(L-1)</text>

  <rect x="330" y="286" width="370" height="31" rx="9" fill="#fff7d6" stroke="#d3a51c" stroke-width="1.2"/>
  <text x="515" y="307" text-anchor="middle" font-family="Arial, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="700" fill="#8a5a00">OVERLAP 1：B(L-1) U2 H2D ∥ A(L-1) GPU compute</text>

  <!-- A enters layer L and submits CPU work before handing off. -->
  <rect x="830" y="310" width="170" height="55" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="915" y="333" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1e3a8a">expert_cache_policy</text>
  <text x="915" y="354" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#1e40af">cpu_topk_ids + copy_map</text>

  <rect x="1020" y="310" width="160" height="55" rx="9" fill="#ffedd5" stroke="#f97316" stroke-width="1.5"/>
  <text x="1100" y="333" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#9a3412">D2H inputs</text>
  <text x="1100" y="354" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#9a3412">submit_kernel(A)</text>

  <rect x="1200" y="310" width="200" height="55" rx="9" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="1300" y="333" text-anchor="middle" font-family="Arial, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="700" fill="#78350f">跨 uBatch 延迟交接</text>
  <text x="1300" y="354" text-anchor="middle" font-family="Arial, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="12" fill="#92400e">先提交 CPU-A，再唤醒 B</text>

  <rect x="1600" y="310" width="178" height="55" rx="9" fill="#ffedd5" stroke="#f97316" stroke-width="1.5"/>
  <text x="1689" y="333" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#9a3412">cpu_moe_sync(A)</text>
  <text x="1689" y="354" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#9a3412">poll + H2D CPU output</text>

  <rect x="1070" y="400" width="550" height="55" rx="9" fill="#fecaca" stroke="#dc2626" stroke-width="1.5"/>
  <text x="1345" y="434" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#991b1b">CPU-A forward</text>

  <!-- Phase 2: safe D2D commit, then B's GPU work covers CPU-A. -->
  <rect x="1240" y="490" width="150" height="55" rx="9" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>
  <text x="1315" y="513" text-anchor="middle" font-family="Arial, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="700" fill="#78350f">B 安全写入 Experts Cache</text>
  <text x="1315" y="534" text-anchor="middle" font-family="Arial, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="11" fill="#78350f">短D2D + 更新 cache map</text>

  <rect x="1410" y="490" width="310" height="55" rx="9" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/>
  <text x="1565" y="513" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#14532d">B(L-1) GPU model work</text>
  <text x="1565" y="534" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#166534">cached MoE + reduce + attention/router(L)</text>

  <rect x="1410" y="556" width="210" height="31" rx="9" fill="#dff4fb" stroke="#43a6c9" stroke-width="1.2"/>
  <text x="1515" y="577" text-anchor="middle" font-family="Arial, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="700" fill="#1e6687">OVERLAP 2：CPU-A(L) ∥ B(L-1) GPU compute</text>

  <!-- A resumes and completes its layer plus the following model work. -->
  <rect x="1790" y="580" width="300" height="55" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="1940" y="603" text-anchor="middle" font-family="Arial, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="700" fill="#14532d">A(L) GPU model work</text>
  <text x="1940" y="624" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#166534">cached MoE + reduce + attention/router(L+1)</text>

  <rect x="2100" y="580" width="92" height="55" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="2146" y="603" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#1e3a8a">reader</text>
  <text x="2146" y="624" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#1e40af">done(L)</text>

  <!-- Dependencies. -->
  <line x1="700" y1="247" x2="1230" y2="517" stroke="#d97706" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-orange)"/>
  <line x1="812" y1="157" x2="1230" y2="508" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-red)"/>
  <line x1="1180" y1="337" x2="1200" y2="337" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="1400" y1="337" x2="1240" y2="505" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="1620" y1="427" x2="1600" y2="337" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="1778" y1="337" x2="1790" y2="607" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
</svg>
