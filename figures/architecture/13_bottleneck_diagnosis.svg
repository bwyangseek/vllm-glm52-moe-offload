<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="930" viewBox="0 0 1600 930">
  <title>MoE offload bottleneck diagnosis decision tree</title>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.12"/></filter>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
  </defs>
  <rect width="1600" height="930" fill="#ffffff"/>
  <text x="800" y="46" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#0f172a">Diagnose the symptom before tuning E/K/U/T/Chunk</text>
  <text x="800" y="77" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#64748b">A higher cache hit rate is not automatically a faster service</text>

  <rect x="570" y="112" width="460" height="78" rx="15" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" filter="url(#shadow)"/>
  <text x="800" y="143" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#0c4a6e">What regressed?</text>
  <text x="800" y="169" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#075985">OOM / TTFT / TPOT / P99 ITL / total throughput</text>

  <!-- Branch headers -->
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="45" y="262" width="270" height="78" rx="13" fill="#fee2e2" stroke="#dc2626" stroke-width="2" filter="url(#shadow)"/><text x="180" y="291" font-size="18" font-weight="700" fill="#991b1b">OOM / engine exits</text><text x="180" y="317" font-size="13" fill="#991b1b">capacity or transient peak</text>
    <rect x="355" y="262" width="270" height="78" rx="13" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/><text x="490" y="291" font-size="18" font-weight="700" fill="#78350f">TTFT is high</text><text x="490" y="317" font-size="13" fill="#92400e">prefill critical path</text>
    <rect x="665" y="262" width="270" height="78" rx="13" fill="#ffedd5" stroke="#ea580c" stroke-width="2" filter="url(#shadow)"/><text x="800" y="291" font-size="18" font-weight="700" fill="#9a3412">TPOT is high</text><text x="800" y="317" font-size="13" fill="#9a3412">decode steady state</text>
    <rect x="975" y="262" width="270" height="78" rx="13" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2" filter="url(#shadow)"/><text x="1110" y="291" font-size="18" font-weight="700" fill="#5b21b6">P99 ITL is high</text><text x="1110" y="317" font-size="13" fill="#6d28d9">mixed scheduling stalls</text>
    <rect x="1285" y="262" width="270" height="78" rx="13" fill="#dcfce7" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/><text x="1420" y="291" font-size="18" font-weight="700" fill="#166534">Throughput is low</text><text x="1420" y="317" font-size="13" fill="#15803d">global resource balance</text>
  </g>

  <!-- arrows -->
  <path d="M800 190 C800 230,180 220,180 252" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <path d="M800 190 C800 230,490 220,490 252" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="800" y1="190" x2="800" y2="252" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <path d="M800 190 C800 230,1110 220,1110 252" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <path d="M800 190 C800 230,1420 220,1420 252" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>

  <!-- Diagnostic cards -->
  <g font-family="Arial, sans-serif">
    <rect x="45" y="378" width="270" height="350" rx="14" fill="#fff" stroke="#fca5a5" stroke-width="1.7"/>
    <text x="65" y="410" font-size="16" font-weight="700" fill="#991b1b">Check</text>
    <text x="65" y="440" font-size="13" fill="#334155">• startup memory profile</text><text x="65" y="466" font-size="13" fill="#334155">• hard 16K runtime workspace</text><text x="65" y="492" font-size="13" fill="#334155">• KV blocks / concurrency</text><text x="65" y="518" font-size="13" fill="#334155">• allocator fragmentation</text>
    <text x="65" y="559" font-size="16" font-weight="700" fill="#991b1b">Act</text>
    <text x="65" y="589" font-size="13" fill="#334155">• lower E first if KV-starved</text><text x="65" y="615" font-size="13" fill="#334155">• reserve runtime headroom</text><text x="65" y="641" font-size="13" fill="#334155">• lower C / output budget</text><text x="65" y="667" font-size="13" fill="#334155">• validate 32K/64K/128K separately</text>
    <text x="65" y="707" font-size="12" font-weight="700" fill="#dc2626">Do not infer from 16K startup alone.</text>

    <rect x="355" y="378" width="270" height="350" rx="14" fill="#fff" stroke="#fcd34d" stroke-width="1.7"/>
    <text x="375" y="410" font-size="16" font-weight="700" fill="#78350f">Check</text>
    <text x="375" y="440" font-size="13" fill="#334155">• actual ntok distribution</text><text x="375" y="466" font-size="13" fill="#334155">• update H2D vs layer compute</text><text x="375" y="492" font-size="13" fill="#334155">• tiny tail chunks</text><text x="375" y="518" font-size="13" fill="#334155">• JIT in live requests</text>
    <text x="375" y="559" font-size="16" font-weight="700" fill="#78350f">Act</text>
    <text x="375" y="589" font-size="13" fill="#334155">• calibrate T_hide</text><text x="375" y="615" font-size="13" fill="#334155">• tune soft/hard chunk</text><text x="375" y="641" font-size="13" fill="#334155">• warm real prompt shapes</text><text x="375" y="667" font-size="13" fill="#334155">• inspect ping-pong reuse stalls</text>
    <text x="375" y="707" font-size="12" font-weight="700" fill="#d97706">Use prefill Nsight, not decode stats.</text>

    <rect x="665" y="378" width="270" height="350" rx="14" fill="#fff" stroke="#fdba74" stroke-width="1.7"/>
    <text x="685" y="410" font-size="16" font-weight="700" fill="#9a3412">Check</text>
    <text x="685" y="440" font-size="13" fill="#334155">• unique CPU miss experts</text><text x="685" y="466" font-size="13" fill="#334155">• CPU compute duration</text><text x="685" y="492" font-size="13" fill="#334155">• H2D output + merge</text><text x="685" y="518" font-size="13" fill="#334155">• 跨 uBatch 交接空洞</text>
    <text x="685" y="559" font-size="16" font-weight="700" fill="#9a3412">Act</text>
    <text x="685" y="589" font-size="13" fill="#334155">• sweep U around 1/2/4</text><text x="685" y="615" font-size="13" fill="#334155">• tune T after U is fixed</text><text x="685" y="641" font-size="13" fill="#334155">• change E only with memory data</text><text x="685" y="667" font-size="13" fill="#334155">• optimize pressure layers</text>
    <text x="685" y="707" font-size="12" font-weight="700" fill="#ea580c">Hit-route% alone is insufficient.</text>

    <rect x="975" y="378" width="270" height="350" rx="14" fill="#fff" stroke="#c4b5fd" stroke-width="1.7"/>
    <text x="995" y="410" font-size="16" font-weight="700" fill="#5b21b6">Check</text>
    <text x="995" y="440" font-size="13" fill="#334155">• prefill/decode co-schedule</text><text x="995" y="466" font-size="13" fill="#334155">• graph fallback to eager</text><text x="995" y="492" font-size="13" fill="#334155">• prefix eviction / recompute</text><text x="995" y="518" font-size="13" fill="#334155">• request-length outliers</text>
    <text x="995" y="559" font-size="16" font-weight="700" fill="#5b21b6">Act</text>
    <text x="995" y="589" font-size="13" fill="#334155">• protect decode soft budget</text><text x="995" y="615" font-size="13" fill="#334155">• verify graph-safe shapes</text><text x="995" y="641" font-size="13" fill="#334155">• test prefix and random both</text><text x="995" y="667" font-size="13" fill="#334155">• report P50/P95/P99</text>
    <text x="995" y="707" font-size="12" font-weight="700" fill="#7c3aed">Average throughput can hide stalls.</text>

    <rect x="1285" y="378" width="270" height="350" rx="14" fill="#fff" stroke="#86efac" stroke-width="1.7"/>
    <text x="1305" y="410" font-size="16" font-weight="700" fill="#166534">Check</text>
    <text x="1305" y="440" font-size="13" fill="#334155">• GPU occupancy / TP size</text><text x="1305" y="466" font-size="13" fill="#334155">• CPU NUMA locality</text><text x="1305" y="492" font-size="13" fill="#334155">• Triton config for E shape</text><text x="1305" y="518" font-size="13" fill="#334155">• per-GPU efficiency</text>
    <text x="1305" y="559" font-size="16" font-weight="700" fill="#166534">Act</text>
    <text x="1305" y="589" font-size="13" fill="#334155">• compare total and per-GPU</text><text x="1305" y="615" font-size="13" fill="#334155">• tune kernel E180/E76</text><text x="1305" y="641" font-size="13" fill="#334155">• bind CPU workers locally</text><text x="1305" y="667" font-size="13" fill="#334155">• separate compute/copy limits</text>
    <text x="1305" y="707" font-size="12" font-weight="700" fill="#16a34a">TP8 vs TP16 is not same-hardware.</text>
  </g>

  <rect x="115" y="778" width="1370" height="100" rx="16" fill="#f8fafc" stroke="#64748b" stroke-width="1.8"/>
  <text x="800" y="811" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#0f172a">Measurement order</text>
  <text x="800" y="841" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#334155">Performance A/B → locate the symptom → focused Nsight trace → eager stats/replay → change one parameter family → cold restart and repeat</text>
  <text x="800" y="864" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#64748b">Do not enable cudagraph metrics, hotspot logging or replay during the final throughput run.</text>
</svg>
