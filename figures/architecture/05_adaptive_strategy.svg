<rect x="62.00" y="220.00" width="58.00" height="54.00" rx="7.00" fill="#FFFFFF" fill-opacity="1.000" stroke="#111111" stroke-width="1.50"/>
<text x="91.00" y="254.00" font-family="Times New Roman, Times, serif" font-size="16" font-weight="700" text-anchor="middle" fill="#111111">H</text>
<rect x="120.00" y="220.00" width="258.00" height="54.00" rx="7.00" fill="#FFFFFF" fill-opacity="1.000" stroke="#111111" stroke-width="1.50"/>
<text x="138.00" y="253.00" font-family="Times New Roman, Times, serif" font-size="15" font-weight="500" text-anchor="start" fill="#111111">hard token budget</text>
<rect x="62.00" y="290.00" width="58.00" height="54.00" rx="7.00" fill="#FFFFFF" fill-opacity="1.000" stroke="#111111" stroke-width="1.50"/>
<text x="91.00" y="324.00" font-family="Times New Roman, Times, serif" font-size="16" font-weight="700" text-anchor="middle" fill="#111111">P</text>
<rect x="120.00" y="290.00" width="258.00" height="54.00" rx="7.00" fill="#FFFFFF" fill-opacity="1.000" stroke="#111111" stroke-width="1.50"/>
<text x="138.00" y="323.00" font-family="Times New Roman, Times, serif" font-size="15" font-weight="500" text-anchor="start" fill="#111111">prefill tokens already scheduled</text>
<rect x="62.00" y="360.00" width="58.00" height="54.00" rx="7.00" fill="#CBD8EB" fill-opacity="1.000" stroke="#111111" stroke-width="1.50"/>
<text x="91.00" y="394.00" font-family="Times New Roman, Times, serif" font-size="16" font-weight="700" text-anchor="middle" fill="#111111">S</text>
<rect x="120.00" y="360.00" width="258.00" height="54.00" rx="7.00" fill="#CBD8EB" fill-opacity="1.000" stroke="#111111" stroke-width="1.50"/>
