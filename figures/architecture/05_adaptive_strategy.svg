<rect x="120.00" y="500.00" width="258.00" height="54.00" rx="7.00" fill="#C9E2B6" fill-opacity="1.000" stroke="#111111" stroke-width="1.50"/>
<text x="138.00" y="533.00" font-family="Times New Roman, Times, serif" font-size="15" font-weight="500" text-anchor="start" fill="#111111">decode_busy</text>
<text x="225.00" y="586.00" font-family="Times New Roman, Times, serif" font-size="14" font-weight="500" text-anchor="middle" fill="#111111">For E180: 256 − 180 = 76 transferred experts</text>
<text x="225.00" y="603.50" font-family="Times New Roman, Times, serif" font-size="14" font-weight="500" text-anchor="middle" fill="#111111">T_hide ≈ 6800 tokens, rounded to the KV block size</text>
<text x="740.00" y="103.00" font-family="Times New Roman, Times, serif" font-size="19" font-weight="600" text-anchor="middle" fill="#111111">(b) Adaptive chunk selection</text>
<rect x="445.00" y="120.00" width="590.00" height="500.00" rx="9.00" fill="#FFFFFF" fill-opacity="1.000" stroke="#111111" stroke-width="1.80"/>
<rect x="495.00" y="150.00" width="230.00" height="60.00" rx="9.00" fill="#FFFFFF" fill-opacity="1.000" stroke="#111111" stroke-width="1.80"/>
<text x="610.00" y="185.44" font-family="Times New Roman, Times, serif" font-size="16" font-weight="600" text-anchor="middle" fill="#111111">hard = min(R, H)</text>
<rect x="495.00" y="245.00" width="230.00" height="60.00" rx="9.00" fill="#CBD8EB" fill-opacity="1.000" stroke="#111111" stroke-width="1.80"/>
<text x="610.00" y="280.44" font-family="Times New Roman, Times, serif" font-size="16" font-weight="600" text-anchor="middle" fill="#111111">decode_busy ?</text>
<rect x="795.00" y="245.00" width="190.00" height="60.00" rx="9.00" fill="#C9E2B6" fill-opacity="1.000" stroke="#111111" stroke-width="1.80"/>
<text x="890.00" y="271.10" font-family="Times New Roman, Times, serif" font-size="15" font-weight="600" text-anchor="middle" fill="#111111">No</text>
<text x="890.00" y="289.10" font-family="Times New Roman, Times, serif" font-size="15" font-weight="600" text-anchor="middle" fill="#111111">select hard</text>
<rect x="495.00" y="340.00" width="230.00" height="60.00" rx="9.00" fill="#CBD8EB" fill-opacity="1.000" stroke="#111111" stroke-width="1.80"/>
<text x="610.00" y="375.10" font-family="Times New Roman, Times, serif" font-size="15" font-weight="600" text-anchor="middle" fill="#111111">soft_remaining = S − P</text>
<rect x="795.00" y="340.00" width="190.00" height="60.00" rx="9.00" fill="#F2C5A7" fill-opacity="1.000" stroke="#111111" stroke-width="1.80"/>
<text x="890.00" y="366.10" font-family="Times New Roman, Times, serif" font-size="15" font-weight="600" text-anchor="middle" fill="#111111">≤ 0</text>
<text x="890.00" y="384.10" font-family="Times New Roman, Times, serif" font-size="15" font-weight="600" text-anchor="middle" fill="#111111">defer prefill</text>
<rect x="495.00" y="435.00" width="230.00" height="60.00" rx="9.00" fill="#CBD8EB" fill-opacity="1.000" stroke="#111111" stroke-width="1.80"/>
<text x="610.00" y="461.10" font-family="Times New Roman, Times, serif" font-size="15" font-weight="600" text-anchor="middle" fill="#111111">C = min(hard,</text>
<text x="610.00" y="479.10" font-family="Times New Roman, Times, serif" font-size="15" font-weight="600" text-anchor="middle" fill="#111111">soft_remaining)</text>
<rect x="770.00" y="430.00" width="230.00" height="135.00" rx="9.00" fill="#F8DFA0" fill-opacity="1.000" stroke="#111111" stroke-width="1.80"/>
<text x="885.00" y="475.60" font-family="Times New Roman, Times, serif" font-size="15" font-weight="600" text-anchor="middle" fill="#111111">Tail-aware rules</text>
<text x="885.00" y="493.60" font-family="Times New Roman, Times, serif" font-size="15" font-weight="600" text-anchor="middle" fill="#111111">balance → ceil(R / 2)</text>
<text x="885.00" y="511.60" font-family="Times New Roman, Times, serif" font-size="15" font-weight="600" text-anchor="middle" fill="#111111">small tail → finish R</text>
<text x="885.00" y="529.60" font-family="Times New Roman, Times, serif" font-size="15" font-weight="600" text-anchor="middle" fill="#111111">otherwise → C</text>
<rect x="495.00" y="540.00" width="230.00" height="55.00" rx="9.00" fill="#C9E2B6" fill-opacity="1.000" stroke="#111111" stroke-width="1.80"/>
<text x="610.00" y="572.60" font-family="Times New Roman, Times, serif" font-size="15" font-weight="600" text-anchor="middle" fill="#111111">selected prefill chunk</text>
<line x1="610.00" y1="210.00" x2="610.00" y2="245.00" stroke="#E32626" stroke-width="2" marker-end="url(#arrow-prefetch-small)"/>
<line x1="725.00" y1="275.00" x2="795.00" y2="275.00" stroke="#111111" stroke-width="2" marker-end="url(#arrow-small)"/>
<text x="758.00" y="264.00" font-family="Times New Roman, Times, serif" font-size="13" font-weight="600" text-anchor="middle" fill="#111111">No</text>
<line x1="610.00" y1="305.00" x2="610.00" y2="340.00" stroke="#E32626" stroke-width="2" marker-end="url(#arrow-prefetch-small)"/>
<text x="626.00" y="326.00" font-family="Times New Roman, Times, serif" font-size="13" font-weight="600" text-anchor="start" fill="#E32626">Yes</text>
<line x1="725.00" y1="370.00" x2="795.00" y2="370.00" stroke="#111111" stroke-width="2" marker-end="url(#arrow-small)"/>
<line x1="610.00" y1="400.00" x2="610.00" y2="435.00" stroke="#E32626" stroke-width="2" marker-end="url(#arrow-prefetch-small)"/>
<line x1="725.00" y1="465.00" x2="770.00" y2="465.00" stroke="#111111" stroke-width="2" marker-end="url(#arrow-small)"/>
<line x1="610.00" y1="495.00" x2="610.00" y2="540.00" stroke="#E32626" stroke-width="2" marker-end="url(#arrow-prefetch-small)"/>
<line x1="885.00" y1="565.00" x2="725.00" y2="565.00" stroke="#111111" stroke-width="2" marker-end="url(#arrow-small)"/>
<text x="1255.00" y="103.00" font-family="Times New Roman, Times, serif" font-size="19" font-weight="600" text-anchor="middle" fill="#111111">(c) Selection outcomes</text>
<rect x="1060.00" y="120.00" width="410.00" height="500.00" rx="9.00" fill="#FFFFFF" fill-opacity="1.000" stroke="#111111" stroke-width="1.80"/>
<rect x="1100.00" y="155.00" width="330.00" height="86.00" rx="9.00" fill="#C9E2B6" fill-opacity="1.000" stroke="#111111" stroke-width="1.80"/>
<text x="1265.00" y="185.10" font-family="Times New Roman, Times, serif" font-size="15" font-weight="600" text-anchor="middle" fill="#111111">Decode idle</text>
<text x="1265.00" y="203.10" font-family="Times New Roman, Times, serif" font-size="15" font-weight="600" text-anchor="middle" fill="#111111">selected = min(R, H)</text>
<text x="1265.00" y="221.10" font-family="Times New Roman, Times, serif" font-size="15" font-weight="600" text-anchor="middle" fill="#111111">maximize prefill throughput</text>
<rect x="1100.00" y="263.00" width="330.00" height="86.00" rx="9.00" fill="#CBD8EB" fill-opacity="1.000" stroke="#111111" stroke-width="1.80"/>
<text x="1265.00" y="293.10" font-family="Times New Roman, Times, serif" font-size="15" font-weight="600" text-anchor="middle" fill="#111111">Mixed prefill + decode</text>
<text x="1265.00" y="311.10" font-family="Times New Roman, Times, serif" font-size="15" font-weight="600" text-anchor="middle" fill="#111111">candidate = min(hard, S − P)</text>
<text x="1265.00" y="329.10" font-family="Times New Roman, Times, serif" font-size="15" font-weight="600" text-anchor="middle" fill="#111111">then apply tail rules</text>
<rect x="1100.00" y="371.00" width="330.00" height="86.00" rx="9.00" fill="#F8DFA0" fill-opacity="1.000" stroke="#111111" stroke-width="1.80"/>
<text x="1265.00" y="401.10" font-family="Times New Roman, Times, serif" font-size="15" font-weight="600" text-anchor="middle" fill="#111111">Two viable chunks</text>
<text x="1265.00" y="419.10" font-family="Times New Roman, Times, serif" font-size="15" font-weight="600" text-anchor="middle" fill="#111111">selected = ceil(R / 2)</text>
<text x="1265.00" y="437.10" font-family="Times New Roman, Times, serif" font-size="15" font-weight="600" text-anchor="middle" fill="#111111">balance both chunks</text>
<rect x="1100.00" y="479.00" width="330.00" height="86.00" rx="9.00" fill="#F2C5A7" fill-opacity="1.000" stroke="#111111" stroke-width="1.80"/>
<text x="1265.00" y="509.10" font-family="Times New Roman, Times, serif" font-size="15" font-weight="600" text-anchor="middle" fill="#111111">Transfer-dominated tail</text>
<text x="1265.00" y="527.10" font-family="Times New Roman, Times, serif" font-size="15" font-weight="600" text-anchor="middle" fill="#111111">selected = R</text>
<text x="1265.00" y="545.10" font-family="Times New Roman, Times, serif" font-size="15" font-weight="600" text-anchor="middle" fill="#111111">avoid another E76 H2D</text>
<text x="1265.00" y="594.00" font-family="Times New Roman, Times, serif" font-size="14" font-weight="500" text-anchor="middle" fill="#111111">The policy changes token shape only.</text>
<text x="1265.00" y="611.50" font-family="Times New Roman, Times, serif" font-size="14" font-weight="500" text-anchor="middle" fill="#111111">Prefill still uses the static all-miss E76 plan.</text>
<text x="750.00" y="660.00" font-family="Times New Roman, Times, serif" font-size="19" font-weight="600" text-anchor="middle" fill="#111111">Objective: hide the E76 transfer while preserving decode scheduling opportunities</text>
<text x="70.00" y="718.00" font-family="Times New Roman, Times, serif" font-size="16" font-weight="600" text-anchor="start" fill="#111111">GPU prefill</text>
<text x="70.00" y="778.00" font-family="Times New Roman, Times, serif" font-size="16" font-weight="600" text-anchor="start" fill="#111111">H2D E76</text>
<text x="70.00" y="838.00" font-family="Times New Roman, Times, serif" font-size="16" font-weight="600" text-anchor="start" fill="#111111">Decode</text>
<rect x="190.00" y="690.00" width="820.00" height="42.00" rx="5.00" fill="#F8DFA0" fill-opacity="1.000" stroke="#9D7415" stroke-width="1.30"/>
<text x="600.00" y="716.00" font-family="Times New Roman, Times, serif" font-size="16" font-weight="600" text-anchor="middle" fill="#111111">selected prefill chunk compute</text>
<rect x="270.00" y="750.00" width="610.00" height="42.00" rx="5.00" fill="#DCEAF7" fill-opacity="1.000" stroke="#526B91" stroke-width="1.30"/>
<text x="575.00" y="776.00" font-family="Times New Roman, Times, serif" font-size="15" font-weight="600" text-anchor="middle" fill="#111111">all-miss expert transfer hidden by GPU work</text>
<rect x="190.00" y="810.00" width="150.00" height="42.00" rx="5.00" fill="#C9E2B6" fill-opacity="1.000" stroke="#587D43" stroke-width="1.30"/>
<rect x="1040.00" y="810.00" width="150.00" height="42.00" rx="5.00" fill="#C9E2B6" fill-opacity="1.000" stroke="#587D43" stroke-width="1.30"/>
<text x="265.00" y="836.00" font-family="Times New Roman, Times, serif" font-size="15" font-weight="600" text-anchor="middle" fill="#111111">decode step</text>
<text x="1115.00" y="836.00" font-family="Times New Roman, Times, serif" font-size="15" font-weight="600" text-anchor="middle" fill="#111111">next decode</text>
<line x1="1010.00" y1="711.00" x2="1040.00" y2="831.00" stroke="#E32626" stroke-width="1.8" marker-end="url(#arrow-prefetch-small)"/>
<text x="1325.00" y="742.00" font-family="Times New Roman, Times, serif" font-size="15" font-weight="600" text-anchor="middle" fill="#111111">target: T_compute(chunk) ≳ T_H2D(E76)</text>
<text x="1325.00" y="760.75" font-family="Times New Roman, Times, serif" font-size="15" font-weight="600" text-anchor="middle" fill="#111111">soft cap, except when merging a small tail</text>
<text x="750.00" y="884.00" font-family="Times New Roman, Times, serif" font-size="20" font-weight="600" text-anchor="middle" fill="#111111">Figure 5. Adaptive prefill chunk selection for transfer overlap and decode fairness.</text>
</svg>