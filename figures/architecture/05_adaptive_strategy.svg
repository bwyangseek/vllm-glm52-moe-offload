<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1450" viewBox="0 0 1500 1450">
  <title>GLM-5.2 FP8 Adaptive Prefill 决策逻辑与执行结果</title>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .font { font-family: Arial, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #172033; }
      .section { font-size: 24px; font-weight: 700; }
      .node-title { font-size: 18px; font-weight: 700; }
      .node-sub { font-size: 15px; font-weight: 400; }
      .branch { font-size: 15px; font-weight: 700; }
      .line { fill: none; stroke: #334155; stroke-width: 2; marker-end: url(#arrow); }
      .process { fill: #ffffff; stroke: #475569; stroke-width: 2; }
      .decision { fill: #f1f5f9; stroke: #475569; stroke-width: 2; }
      .result { fill: #e8f1f8; stroke: #4f7898; stroke-width: 2; }
      .timeline { fill: #ffffff; stroke: #475569; stroke-width: 1.8; }
      .transfer { fill: #e8f1f8; stroke: #4f7898; stroke-width: 1.8; }
      .decode { fill: #f1f5f9; stroke: #64748b; stroke-width: 1.8; }
    </style>
  </defs>

  <rect width="1500" height="1450" fill="#ffffff"/>
  <text class="font" x="750" y="45" text-anchor="middle" font-size="30" font-weight="700">Adaptive Prefill Chunk</text>

  <!-- 3. Vertical flowchart -->
  <text class="font section" x="70" y="95">Chunk 选择逻辑</text>

  <!-- Start -->
  <rect class="process" x="550" y="120" width="400" height="68" rx="34"/>
  <text class="font node-title" x="750" y="149" text-anchor="middle">输入调度状态</text>
  <text class="font node-sub" x="750" y="173" text-anchor="middle">R、B_hard、B_soft、T_hide、decode_busy</text>

  <line class="line" x1="750" y1="188" x2="750" y2="226"/>

  <!-- Hard bound -->
  <rect class="process" x="535" y="230" width="430" height="70" rx="8"/>
  <text class="font node-title" x="750" y="260" text-anchor="middle">应用硬约束</text>
  <text class="font node-sub" x="750" y="284" text-anchor="middle">B_chunk,hard = min(R, B_hard)</text>

  <line class="line" x1="750" y1="300" x2="750" y2="337"/>

  <!-- Decode busy decision -->
  <polygon class="decision" points="750,340 960,410 750,480 540,410"/>
  <text class="font node-title" x="750" y="404" text-anchor="middle">当前 Step 是否存在</text>
  <text class="font node-title" x="750" y="428" text-anchor="middle">Decode 请求？</text>

  <!-- No branch -->
  <polyline class="line" points="540,410 395,410 395,445"/>
  <text class="font branch" x="465" y="396" text-anchor="middle">否</text>
  <rect class="result" x="190" y="450" width="410" height="70" rx="35"/>
  <text class="font node-title" x="395" y="479" text-anchor="middle">纯 Prefill：使用硬上限</text>
  <text class="font node-sub" x="395" y="503" text-anchor="middle">B_actual = B_chunk,hard</text>

  <!-- Yes branch -->
  <line class="line" x1="750" y1="480" x2="750" y2="527"/>
  <text class="font branch" x="770" y="510">是</text>

  <!-- Soft candidate -->
  <rect class="process" x="535" y="530" width="430" height="70" rx="8"/>
  <text class="font node-title" x="750" y="560" text-anchor="middle">生成 Soft 候选值</text>
  <text class="font node-sub" x="750" y="584" text-anchor="middle">B_candidate = min(B_chunk,hard, B_soft)</text>

  <line class="line" x1="750" y1="600" x2="750" y2="637"/>

  <!-- Balanced split decision -->
  <polygon class="decision" points="750,640 1000,715 750,790 500,715"/>
  <text class="font node-title" x="750" y="697" text-anchor="middle">能否平衡成两个 Chunk，</text>
  <text class="font node-title" x="750" y="722" text-anchor="middle">且两块都不小于 T_hide？</text>
  <text class="font node-sub" x="750" y="750" text-anchor="middle">2 × T_hide ≤ R ≤ 2 × B_soft</text>

  <!-- Balanced yes result -->
  <line class="line" x1="1000" y1="715" x2="1092" y2="715"/>
  <text class="font branch" x="1045" y="698" text-anchor="middle">是</text>
  <rect class="result" x="1095" y="680" width="330" height="70" rx="35"/>
  <text class="font node-title" x="1260" y="709" text-anchor="middle">平衡两轮</text>
  <text class="font node-sub" x="1260" y="733" text-anchor="middle">B_actual = ceil(R / 2)</text>

  <!-- Balanced no -->
  <line class="line" x1="750" y1="790" x2="750" y2="837"/>
  <text class="font branch" x="770" y="820">否</text>

  <!-- Tail decision -->
  <polygon class="decision" points="750,840 1000,915 750,990 500,915"/>
  <text class="font node-title" x="750" y="897" text-anchor="middle">候选值是否留下</text>
  <text class="font node-title" x="750" y="922" text-anchor="middle">小于 T_hide 的尾块？</text>
  <text class="font node-sub" x="750" y="950" text-anchor="middle">R − B_candidate &lt; T_hide，且 R ≤ B_hard</text>

  <!-- Tail yes result -->
  <line class="line" x1="1000" y1="915" x2="1092" y2="915"/>
  <text class="font branch" x="1045" y="898" text-anchor="middle">是</text>
  <rect class="result" x="1095" y="880" width="330" height="70" rx="35"/>
  <text class="font node-title" x="1260" y="909" text-anchor="middle">合并小尾块，一次完成</text>
  <text class="font node-sub" x="1260" y="933" text-anchor="middle">B_actual = R</text>

  <!-- Tail no result -->
  <line class="line" x1="750" y1="990" x2="750" y2="1027"/>
  <text class="font branch" x="770" y="1017">否</text>
  <rect class="result" x="570" y="1030" width="360" height="70" rx="35"/>
  <text class="font node-title" x="750" y="1059" text-anchor="middle">使用 Soft 候选值</text>
  <text class="font node-sub" x="750" y="1083" text-anchor="middle">B_actual = B_candidate</text>

  <!-- Divider -->
  <line x1="70" y1="1140" x2="1430" y2="1140" stroke="#cbd5e1" stroke-width="2"/>

  <!-- 4. Execution result -->
  <text class="font section" x="70" y="1185">执行结果：两个 7000-token Chunk 分别覆盖一轮 E76 H2D</text>

  <text class="font node-title" x="160" y="1240" text-anchor="end">GPU Prefill</text>
  <text class="font node-title" x="160" y="1305" text-anchor="end">Expert H2D</text>
  <text class="font node-title" x="160" y="1370" text-anchor="end">Decode</text>

  <!-- Chunk 1 -->
  <rect class="timeline" x="210" y="1208" width="470" height="48" rx="6"/>
  <text class="font node-title" x="445" y="1238" text-anchor="middle">Chunk 1：7000-token GPU 计算</text>
  <rect class="transfer" x="255" y="1273" width="380" height="42" rx="6"/>
  <text class="font node-sub" x="445" y="1300" text-anchor="middle">Layer L+1：搬运 76 个未缓存专家</text>

  <!-- Decode gaps -->
  <rect class="decode" x="90" y="1338" width="120" height="42" rx="21"/>
  <text class="font node-sub" x="150" y="1365" text-anchor="middle">Decode step</text>
  <rect class="decode" x="680" y="1338" width="140" height="42" rx="21"/>
  <text class="font node-sub" x="750" y="1365" text-anchor="middle">Decode step</text>

  <!-- Chunk 2 -->
  <rect class="timeline" x="820" y="1208" width="470" height="48" rx="6"/>
  <text class="font node-title" x="1055" y="1238" text-anchor="middle">Chunk 2：7000-token GPU 计算</text>
  <rect class="transfer" x="865" y="1273" width="380" height="42" rx="6"/>
  <text class="font node-sub" x="1055" y="1300" text-anchor="middle">Layer L+1：搬运 76 个未缓存专家</text>
  <rect class="decode" x="1290" y="1338" width="140" height="42" rx="21"/>
  <text class="font node-sub" x="1360" y="1365" text-anchor="middle">Decode step</text>

  <line class="line" x1="680" y1="1232" x2="750" y2="1338"/>
  <line class="line" x1="1290" y1="1232" x2="1360" y2="1338"/>

  <text class="font" x="750" y="1420" text-anchor="middle" font-size="16" font-weight="600">Adaptive 调整的是每轮 Prefill Token 数；目标是以 GPU 计算覆盖下一层专家 H2D。</text>
</svg>
