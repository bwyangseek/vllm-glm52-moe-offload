<rect x="62.00" y="430.00" width="58.00" height="54.00" rx="7.00" fill="#F8DFA0" fill-opacity="1.000" stroke="#111111" stroke-width="1.50"/>
<text x="91.00" y="464.00" font-family="Times New Roman, Times, serif" font-size="16" font-weight="700" text-anchor="middle" fill="#111111">T_hide</text>
<rect x="120.00" y="430.00" width="258.00" height="54.00" rx="7.00" fill="#F8DFA0" fill-opacity="1.000" stroke="#111111" stroke-width="1.50"/>
<text x="138.00" y="463.00" font-family="Times New Roman, Times, serif" font-size="15" font-weight="500" text-anchor="start" fill="#111111">overlap threshold</text>
<rect x="62.00" y="500.00" width="58.00" height="54.00" rx="7.00" fill="#C9E2B6" fill-opacity="1.000" stroke="#111111" stroke-width="1.50"/>
