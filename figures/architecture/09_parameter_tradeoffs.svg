<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760">
  <title>MoE offload parameter tradeoffs</title>
  <defs><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.12"/></filter><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker></defs>
  <rect width="1400" height="760" fill="#fff"/>
  <text x="700" y="46" text-anchor="middle" font-family="Arial" font-size="29" font-weight="700" fill="#111827">There is no isolated best knob: E, K, U, T and chunk size constrain each other</text>
  <text x="700" y="76" text-anchor="middle" font-family="Arial" font-size="16" fill="#64748b">Optimization target = throughput + TPOT/P99 + memory safety, not cache hit rate alone</text>

  <!-- cards -->
  <g filter="url(#s)">
    <rect x="55" y="120" width="400" height="500" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <rect x="500" y="120" width="400" height="500" rx="18" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <rect x="945" y="120" width="400" height="500" rx="18" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  </g>
  <text x="255" y="160" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#1e3a8a">E: resident experts</text>
  <text x="700" y="160" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#9a3412">K / U / T: decode policy</text>
  <text x="1145" y="160" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#166534">Prefill chunk</text>

  <line x1="115" y1="215" x2="390" y2="215" stroke="#2563eb" stroke-width="4" marker-end="url(#a)"/>
  <text x="115" y="200" font-family="Arial" font-size="14" fill="#1e3a8a">smaller E</text><text x="335" y="200" font-family="Arial" font-size="14" fill="#1e3a8a">larger E</text>
  <g font-family="Arial" font-size="16" fill="#1e3a8a">
    <text x="90" y="265">↑ GPU cache hit rate</text><text x="90" y="300">↓ Decode CPU miss</text><text x="90" y="335">↓ Prefill miss experts</text><text x="90" y="370">↑ resident GPU memory</text><text x="90" y="405">↓ KV cache capacity</text><text x="90" y="440">↓ runtime memory margin</text>
  </g>
  <rect x="90" y="490" width="330" height="88" rx="10" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="255" y="520" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#1e3a8a">E180 is a system-level point</text><text x="255" y="547" text-anchor="middle" font-family="Arial" font-size="14" fill="#1e40af">not simply the maximum experts</text><text x="255" y="568" text-anchor="middle" font-family="Arial" font-size="14" fill="#1e40af">that can be allocated at startup</text>

  <g font-family="Arial" font-size="16" fill="#9a3412">
    <text x="535" y="215"><tspan font-weight="700">K</tspan>: routes affecting cache protection</text>
    <text x="535" y="253"><tspan font-weight="700">U</tspan>: max unique experts updated per layer</text>
    <text x="535" y="291"><tspan font-weight="700">T</tspan>: CPU worker threads per TP rank</text>
  </g>
  <line x1="550" y1="330" x2="850" y2="330" stroke="#ea580c" stroke-width="3" marker-end="url(#a)"/>
  <g font-family="Arial" font-size="15" fill="#9a3412">
    <text x="535" y="370">larger U: fewer CPU misses, more H2D/D2D</text><text x="535" y="402">larger K: stabler hot set, more policy pressure</text><text x="535" y="434">larger T: faster sparse CPU until memory bandwidth</text><text x="535" y="466">too large: PCIe / CPU / NUMA contention and jitter</text>
  </g>
  <rect x="535" y="505" width="330" height="73" rx="10" fill="#ffedd5" stroke="#fb923c"/>
  <text x="700" y="535" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#9a3412">K2/U2/T6 must be measured together</text><text x="700" y="560" text-anchor="middle" font-family="Arial" font-size="14" fill="#9a3412">especially on pressure layers 3–9</text>

  <line x1="1005" y1="215" x2="1280" y2="215" stroke="#16a34a" stroke-width="4" marker-end="url(#a)"/>
  <text x="1005" y="200" font-family="Arial" font-size="14" fill="#166534">smaller</text><text x="1230" y="200" font-family="Arial" font-size="14" fill="#166534">larger</text>
  <g font-family="Arial" font-size="16" fill="#166534">
    <text x="980" y="265">↓ expert-transfer rounds</text><text x="980" y="300">↑ GPU work to hide E76 update</text><text x="980" y="335">↑ FlashMLA/Triton workspace</text><text x="980" y="370">↑ single-step decode blocking</text><text x="980" y="405">↑ OOM and P99 risk</text>
  </g>
  <rect x="980" y="455" width="330" height="123" rx="10" fill="#dcfce7" stroke="#4ade80"/>
  <text x="1145" y="485" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#166534">Adaptive rule</text><text x="1145" y="513" text-anchor="middle" font-family="Arial" font-size="14" fill="#166534">idle: approach hard 16K</text><text x="1145" y="538" text-anchor="middle" font-family="Arial" font-size="14" fill="#166534">decode busy: target soft 8K</text><text x="1145" y="563" text-anchor="middle" font-family="Arial" font-size="14" fill="#166534">merge tails smaller than T_hide</text>

  <rect x="180" y="665" width="1040" height="55" rx="27" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
  <text x="700" y="688" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#0f172a">A configuration is valid only if it satisfies all three dimensions</text>
  <text x="700" y="710" text-anchor="middle" font-family="Arial" font-size="14" fill="#334155">expert locality · overlap window · KV/workspace memory margin</text>
</svg>
