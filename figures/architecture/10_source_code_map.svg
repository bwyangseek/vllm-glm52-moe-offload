<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
  <title>GLM-5.2 FP8 MoE Offload source code map</title>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.12"/></filter>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
    <marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker>
    <marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#ea580c"/></marker>
  </defs>
  <rect width="1600" height="980" fill="#ffffff"/>
  <text x="800" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#0f172a">Source map: where each offload responsibility lives</text>
  <text x="800" y="76" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#64748b">Control plane → native model hook → Python runtime → CPU/CUDA extension → observability</text>

  <!-- Control plane -->
  <rect x="55" y="112" width="1490" height="142" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
  <text x="82" y="143" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#1e3a8a">1. Configuration and scheduling</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="100" y="164" width="345" height="62" rx="10" fill="#dbeafe" stroke="#2563eb"/><text x="272" y="190" font-size="16" font-weight="700" fill="#1e3a8a">config/model.py + engine/arg_utils.py</text><text x="272" y="212" font-size="13" fill="#1e40af">E / K / U / T and adaptive-prefill flags</text>
    <rect x="625" y="164" width="360" height="62" rx="10" fill="#dbeafe" stroke="#2563eb"/><text x="805" y="190" font-size="16" font-weight="700" fill="#1e3a8a">v1/core/sched/scheduler.py</text><text x="805" y="212" font-size="13" fill="#1e40af">decode_busy + tail-aware B_actual</text>
    <rect x="1165" y="164" width="330" height="62" rx="10" fill="#dbeafe" stroke="#2563eb"/><text x="1330" y="190" font-size="16" font-weight="700" fill="#1e3a8a">v1/cudagraph_dispatcher.py</text><text x="1330" y="212" font-size="13" fill="#1e40af">graph-safe decode shapes only</text>
  </g>
  <line x1="445" y1="195" x2="615" y2="195" stroke="#2563eb" stroke-width="2.3" marker-end="url(#ab)"/>

  <!-- Native model hook -->
  <rect x="55" y="286" width="1490" height="151" rx="18" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
  <text x="82" y="317" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#166534">2. Native vLLM model path and the narrow hook</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="100" y="339" width="375" height="67" rx="10" fill="#dcfce7" stroke="#16a34a"/><text x="287" y="366" font-size="16" font-weight="700" fill="#166534">fused_moe/routed_experts.py</text><text x="287" y="389" font-size="13" fill="#15803d">support guards + CPU-host weight creation</text>
    <rect x="615" y="339" width="370" height="67" rx="10" fill="#dcfce7" stroke="#16a34a"/><text x="800" y="366" font-size="16" font-weight="700" fill="#166534">layers/quantization/fp8.py</text><text x="800" y="389" font-size="13" fill="#15803d">setup_layer_cache() + apply()/merge</text>
    <rect x="1125" y="339" width="370" height="67" rx="10" fill="#dcfce7" stroke="#16a34a"/><text x="1310" y="366" font-size="16" font-weight="700" fill="#166534">native Triton Fp8MoE kernel</text><text x="1310" y="389" font-size="13" fill="#15803d">cached/miss GPU computation unchanged</text>
  </g>
  <line x1="475" y1="372" x2="605" y2="372" stroke="#16a34a" stroke-width="2.3" marker-end="url(#a)"/>
  <line x1="985" y1="372" x2="1115" y2="372" stroke="#16a34a" stroke-width="2.3" marker-end="url(#a)"/>

  <!-- Python runtime -->
  <rect x="55" y="469" width="1490" height="183" rx="18" fill="#fff7ed" stroke="#ea580c" stroke-width="2" filter="url(#shadow)"/>
  <text x="82" y="500" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#9a3412">3. Python offload runtime — fused_moe/moe_offload.py</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="92" y="526" width="270" height="92" rx="10" fill="#ffedd5" stroke="#f97316"/><text x="227" y="554" font-size="16" font-weight="700" fill="#9a3412">setup_layer_cache()</text><text x="227" y="578" font-size="13" fill="#9a3412">CPU canonical + E cache</text><text x="227" y="600" font-size="13" fill="#9a3412">maps / buffers / events</text>
    <rect x="395" y="526" width="270" height="92" rx="10" fill="#ffedd5" stroke="#f97316"/><text x="530" y="554" font-size="16" font-weight="700" fill="#9a3412">forward_offload()</text><text x="530" y="578" font-size="13" fill="#9a3412">dtype/shape guards</text><text x="530" y="600" font-size="13" fill="#9a3412">prefill vs decode dispatch</text>
    <rect x="698" y="526" width="270" height="92" rx="10" fill="#fee2e2" stroke="#dc2626"/><text x="833" y="554" font-size="16" font-weight="700" fill="#991b1b">forward_prefetch()</text><text x="833" y="578" font-size="13" fill="#991b1b">all-miss ping-pong</text><text x="833" y="600" font-size="13" fill="#991b1b">copy/compute events</text>
    <rect x="1001" y="526" width="270" height="92" rx="10" fill="#ffedd5" stroke="#ea580c"/><text x="1136" y="554" font-size="16" font-weight="700" fill="#9a3412">forward_dbo()</text><text x="1136" y="578" font-size="13" fill="#9a3412">policy + CPU submit</text><text x="1136" y="600" font-size="13" fill="#9a3412">临时区备货 / 安全写入</text>
    <rect x="1304" y="526" width="196" height="92" rx="10" fill="#fef3c7" stroke="#d97706"/><text x="1402" y="554" font-size="16" font-weight="700" fill="#78350f">延迟交接</text><text x="1402" y="578" font-size="13" fill="#78350f">记录读取完成点</text><text x="1402" y="600" font-size="13" fill="#78350f">跨 uBatch 顺序</text>
  </g>
  <line x1="665" y1="572" x2="688" y2="572" stroke="#ea580c" stroke-width="2.2" marker-end="url(#ao)"/>
  <text x="676" y="556" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#c2410c">prefill</text>
  <path d="M530 618 L530 636 L1136 636 L1136 628" fill="none" stroke="#ea580c" stroke-width="2.2" marker-end="url(#ao)"/>
  <text x="835" y="648" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#c2410c">decode / DBO</text>
  <line x1="1271" y1="572" x2="1294" y2="572" stroke="#ea580c" stroke-width="2.2" marker-end="url(#ao)"/>

  <!-- Native extension -->
  <rect x="55" y="684" width="1490" height="170" rx="18" fill="#f8fafc" stroke="#475569" stroke-width="2" filter="url(#shadow)"/>
  <text x="82" y="715" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a">4. Native extension — csrc/offload</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="100" y="743" width="315" height="78" rx="10" fill="#e2e8f0" stroke="#64748b"/><text x="257" y="771" font-size="16" font-weight="700" fill="#0f172a">py_bindding.cpp</text><text x="257" y="796" font-size="13" fill="#334155">torch.ops.moe_offload_ops.*</text>
    <rect x="500" y="743" width="315" height="78" rx="10" fill="#dbeafe" stroke="#2563eb"/><text x="657" y="771" font-size="16" font-weight="700" fill="#1e3a8a">moe_kernel.cu</text><text x="657" y="796" font-size="13" fill="#1e40af">策略 / 搬运 / 临时区 / 提交与同步</text>
    <rect x="900" y="743" width="280" height="78" rx="10" fill="#fee2e2" stroke="#dc2626"/><text x="1040" y="771" font-size="16" font-weight="700" fill="#991b1b">moe.cpp</text><text x="1040" y="796" font-size="13" fill="#991b1b">W8A16 forwardSparse</text>
    <rect x="1265" y="743" width="235" height="78" rx="10" fill="#fef3c7" stroke="#d97706"/><text x="1382" y="771" font-size="16" font-weight="700" fill="#78350f">forward_context.cpp</text><text x="1382" y="796" font-size="13" fill="#78350f">T-thread work stealing</text>
  </g>
  <line x1="415" y1="782" x2="490" y2="782" stroke="#334155" stroke-width="2.2" marker-end="url(#a)"/>
  <line x1="815" y1="782" x2="890" y2="782" stroke="#334155" stroke-width="2.2" marker-end="url(#a)"/>
  <line x1="1180" y1="782" x2="1255" y2="782" stroke="#334155" stroke-width="2.2" marker-end="url(#a)"/>

  <!-- Vertical ownership arrows -->
  <line x1="800" y1="254" x2="800" y2="276" stroke="#2563eb" stroke-width="2.5" marker-end="url(#ab)"/>
  <line x1="800" y1="437" x2="800" y2="459" stroke="#ea580c" stroke-width="2.5" marker-end="url(#ao)"/>
  <line x1="800" y1="652" x2="800" y2="674" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- Observability -->
  <rect x="255" y="890" width="1090" height="56" rx="13" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"/>
  <text x="800" y="915" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#5b21b6">benchmarks/profiling/moe_offload</text>
  <text x="800" y="936" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#6d28d9">performance modes • Nsight capture • stats/hotspots • replay • numeric audit • cache invariants</text>
