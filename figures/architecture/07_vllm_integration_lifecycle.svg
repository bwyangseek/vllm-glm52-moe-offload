<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="840" viewBox="0 0 1400 840">
  <title>vLLM integration boundary and offload lifecycle</title>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.12"/></filter>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
    <marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker>
    <marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#ea580c"/></marker>
  </defs>
  <rect width="1400" height="840" fill="#fff"/>
  <text x="700" y="44" text-anchor="middle" font-family="Arial" font-size="29" font-weight="700" fill="#111827">vLLM v0.25 integration: preserve model semantics, replace expert ownership</text>
  <text x="700" y="73" text-anchor="middle" font-family="Arial" font-size="16" fill="#64748b">Blue = native vLLM / GLM path retained; orange = expert-wise offload extension</text>

  <!-- Native stack -->
  <rect x="55" y="105" width="1290" height="190" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
  <text x="82" y="137" font-family="Arial" font-size="20" font-weight="700" fill="#1e3a8a">Native model execution path</text>
  <g font-family="Arial" text-anchor="middle">
    <rect x="100" y="165" width="215" height="82" rx="11" fill="#dbeafe" stroke="#2563eb" stroke-width="1.7"/><text x="207" y="198" font-size="18" font-weight="700" fill="#1e3a8a">GLM Router</text><text x="207" y="223" font-size="14" fill="#1e40af">topk_ids + topk_weights</text>
    <rect x="385" y="165" width="215" height="82" rx="11" fill="#dbeafe" stroke="#2563eb" stroke-width="1.7"/><text x="492" y="198" font-size="18" font-weight="700" fill="#1e3a8a">MoERunner</text><text x="492" y="223" font-size="14" fill="#1e40af">DSA / IndexShare retained</text>
    <rect x="670" y="165" width="215" height="82" rx="11" fill="#dbeafe" stroke="#2563eb" stroke-width="1.7"/><text x="777" y="198" font-size="18" font-weight="700" fill="#1e3a8a">RoutedExperts</text><text x="777" y="223" font-size="14" fill="#1e40af">forward_modular()</text>
    <rect x="955" y="165" width="280" height="82" rx="11" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/><text x="1095" y="198" font-size="18" font-weight="700" fill="#1e3a8a">Fp8MoEMethod.apply()</text><text x="1095" y="223" font-size="14" fill="#1e40af">native Triton FP8 kernel retained</text>
  </g>
  <line x1="315" y1="206" x2="375" y2="206" stroke="#2563eb" stroke-width="2.5" marker-end="url(#ab)"/>
  <line x1="600" y1="206" x2="660" y2="206" stroke="#2563eb" stroke-width="2.5" marker-end="url(#ab)"/>
  <line x1="885" y1="206" x2="945" y2="206" stroke="#2563eb" stroke-width="2.5" marker-end="url(#ab)"/>

  <!-- Hook -->
  <line x1="1095" y1="247" x2="1095" y2="325" stroke="#ea580c" stroke-width="3" marker-end="url(#ao)"/>
  <text x="1112" y="292" font-family="Arial" font-size="15" font-weight="700" fill="#c2410c">offload hook</text>

  <!-- Runtime extension -->
  <rect x="500" y="325" width="845" height="448" rx="18" fill="#fff7ed" stroke="#ea580c" stroke-width="2" filter="url(#shadow)"/>
  <text x="528" y="358" font-family="Arial" font-size="20" font-weight="700" fill="#9a3412">CpuOffloadInfer: execution assignment and resource ownership</text>
  <rect x="535" y="384" width="345" height="80" rx="11" fill="#ffedd5" stroke="#f97316" stroke-width="1.6"/>
  <text x="707" y="414" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#9a3412">forward_offload()</text>
  <text x="707" y="440" text-anchor="middle" font-family="Arial" font-size="14" fill="#9a3412">shape + DBO state select the data path</text>

  <rect x="535" y="500" width="345" height="115" rx="11" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="707" y="532" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#991b1b">Prefill: forward_prefetch()</text>
  <text x="707" y="560" text-anchor="middle" font-family="Arial" font-size="14" fill="#991b1b">E76 all-miss → ping-pong buffer</text>
  <text x="707" y="585" text-anchor="middle" font-family="Arial" font-size="14" fill="#991b1b">all routes computed by GPU</text>

  <rect x="535" y="638" width="345" height="105" rx="11" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/>
  <text x="707" y="670" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#9a3412">Decode: forward_dbo()</text>
  <text x="707" y="698" text-anchor="middle" font-family="Arial" font-size="14" fill="#9a3412">GPU hit / U2 update / CPU miss</text>
  <text x="707" y="723" text-anchor="middle" font-family="Arial" font-size="14" fill="#9a3412">安全写入正式缓存 + 双 uBatch 重叠</text>

  <polyline points="707,464 707,482 510,482 510,557 525,557" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <polyline points="707,464 707,482 900,482 900,690 890,690" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="548" y="477" font-family="Arial" font-size="12" fill="#475569">prefill / eager</text>
  <text x="816" y="477" font-family="Arial" font-size="12" fill="#475569">decode / DBO</text>

  <rect x="930" y="384" width="375" height="359" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="1117" y="416" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#0f172a">Shared offload state</text>
  <g font-family="Arial" font-size="15" fill="#334155">
    <text x="960" y="454">• cache_map: expert ID → canonical slot</text>
    <text x="960" y="486">• miss_map: expert ID → prefill slot</text>
    <text x="960" y="518">• policy_sort: victim / protected order</text>
    <text x="960" y="550">• E180 canonical cache per layer</text>
    <text x="960" y="582">• two shared E76 prefill buffers</text>
    <text x="960" y="614">• 每层 U2 隔离临时 Slots</text>
    <text x="960" y="646">• copy/read/commit CUDA events</text>
    <text x="960" y="678">• NUMA-local CPU worker pool</text>
    <text x="960" y="710">• NVTX / stats / replay observability</text>
  </g>

  <!-- Loading/control plane -->
  <rect x="55" y="325" width="395" height="448" rx="18" fill="#f8fafc" stroke="#475569" stroke-width="2" filter="url(#shadow)"/>
  <text x="82" y="358" font-family="Arial" font-size="20" font-weight="700" fill="#0f172a">Loading + scheduling side paths</text>
  <rect x="90" y="388" width="325" height="92" rx="11" fill="#ecfccb" stroke="#4d7c0f" stroke-width="1.6"/>
  <text x="252" y="419" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#365314">Checkpoint load</text>
  <text x="252" y="446" text-anchor="middle" font-family="Arial" font-size="14" fill="#365314">all 256 experts directly into</text>
  <text x="252" y="468" text-anchor="middle" font-family="Arial" font-size="14" fill="#365314">pinned CPU canonical tensors</text>
  <rect x="90" y="512" width="325" height="102" rx="11" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
  <text x="252" y="543" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#78350f">setup_layer_cache()</text>
  <text x="252" y="571" text-anchor="middle" font-family="Arial" font-size="14" fill="#78350f">repack CPU weights + preload E180</text>
  <text x="252" y="594" text-anchor="middle" font-family="Arial" font-size="14" fill="#78350f">分配目录 / Prefill Buffer / Decode 临时区</text>
  <rect x="90" y="646" width="325" height="96" rx="11" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.6"/>
  <text x="252" y="677" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#0c4a6e">Adaptive scheduler</text>
  <text x="252" y="705" text-anchor="middle" font-family="Arial" font-size="14" fill="#0c4a6e">remaining tokens + decode_busy</text>
  <text x="252" y="728" text-anchor="middle" font-family="Arial" font-size="14" fill="#0c4a6e">→ actual prefill chunk</text>
  <line x1="252" y1="480" x2="252" y2="502" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="415" y1="694" x2="525" y2="557" stroke="#0284c7" stroke-width="2.4" marker-end="url(#ab)"/>

  <text x="700" y="813" text-anchor="middle" font-family="Arial" font-size="18" font-weight="600" fill="#111827">The model/router semantics stay native; offload owns only expert storage, placement, transport and merge.</text>
</svg>
